apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-viewer
rules:
- apiGroups: ["", "apps", "batch", "networking.k8s.io"]
  resources:
  - pods
  - services
  - configmaps
  - namespaces
  - deployments
  - daemonsets
  - statefulsets
  - jobs
  - cronjobs
  - ingresses
  - resourcequotas
  verbs: ["get", "list", "watch"]

- apiGroups: ["apiextensions.k8s.io"]
  resources:
  - customresourcedefinitions
  verbs: ["get", "list", "watch"]
